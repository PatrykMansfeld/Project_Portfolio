<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Patryk Mansfeld — Full-Stack Developer & DevOps</title>

    <!-- Theme before first paint: saved choice, else system preference -->
    <script>
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <meta
      name="description"
      content="Portfolio Patryka Mansfelda — Full-Stack Developer & DevOps z Poznania. Vue.js, Node.js, Python, Docker i integracje AI."
    />
    <meta name="author" content="Patryk Mansfeld" />
    <meta
      name="keywords"
      content="Patryk Mansfeld, Full-Stack Developer, DevOps, Vue.js, Node.js, AI, portfolio, Poznań"
    />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://patrykmansfeld.github.io/Project_Portfolio/" />
